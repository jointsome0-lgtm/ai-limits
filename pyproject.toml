[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-limits"
version = "0.1.0"
description = "AI subscription usage limits (Claude, Codex) for your desktop panel. Offline by default."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
ai-limits = "ai_limits.cli:main"

[tool.setuptools.packages.find]
include = ["ai_limits*"]
